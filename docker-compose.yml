services:
  postgres:
    image: postgres:16-alpine
    container_name: reserva_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reserva_user
      POSTGRES_PASSWORD: reserva_pass
      POSTGRES_DB: reserva_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
